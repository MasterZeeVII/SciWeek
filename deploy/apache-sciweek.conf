# Requires: a2enmod proxy proxy_http headers rewrite ssl
# Frontend build must exist at /opt/sciweek/frontend/dist (npm run build)
#
# Cloudflare SSL/TLS mode must be set to "Full (strict)" for the Origin
# Certificate below to be trusted by Cloudflare's edge.

<VirtualHost *:80>
    ServerName www.zernite.net
    ServerAlias zernite.net

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.zernite.net
    ServerAlias zernite.net

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/zernite.net.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/zernite.net.key

    DocumentRoot /opt/sciweek/frontend/dist

    <Directory /opt/sciweek/frontend/dist>
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [L]
    </Directory>

    # Uploaded evidence photos — Django only serves MEDIA_URL itself when DEBUG=1,
    # so in production Apache must serve it directly.
    Alias /media/ /opt/sciweek/media/
    <Directory /opt/sciweek/media>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /media/ !
    ProxyPass /api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/

    ErrorLog ${APACHE_LOG_DIR}/sciweek-error.log
    CustomLog ${APACHE_LOG_DIR}/sciweek-access.log combined
</VirtualHost>
